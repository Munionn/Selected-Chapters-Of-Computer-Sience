{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column inline-list">
                    
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'pizzas' %}active{% endif %}" href="{% url 'pizzeria:admin_pizzas' %}">
                            <i class="fas fa-pizza-slice"></i> Пиццы
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'orders' %}active{% endif %}" href="{% url 'pizzeria:admin_orders' %}">
                            <i class="fas fa-shopping-cart"></i> Заказы
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'customers' %}active{% endif %}" href="{% url 'pizzeria:admin_customers' %}">
                            <i class="fas fa-users"></i> Клиенты
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'analytics' %}active{% endif %}" href="{% url 'pizzeria:admin_analytics' %}">
                            <i class="fas fa-chart-bar"></i> Аналитика
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'slider_settings' %}active{% endif %}" href="{% url 'pizzeria:admin_slider_settings' %}">
                            <i class="fas fa-images"></i> Настройки слайдера
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'range_generator' %}active{% endif %}" href="{% url 'admin_range_generator' %}">
                            <i class="fas fa-sliders-h"></i> Генератор Range
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            {% block admin_content %}{% endblock %}
        </main>
    </div>
</div>

<style>
/* Стили для админ-панели */
#sidebar {
    min-height: calc(100vh - 56px);
    box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
}

#sidebar .nav-link {
    color: var(--primary-color);
    padding: .5rem 1rem;
    border-radius: .25rem;
    margin: .2rem 0;
}

#sidebar .nav-link:hover {
    background-color: rgba(255, 65, 54, 0.1);
}

#sidebar .nav-link.active {
    background-color: var(--primary-color);
    color: var(--text-light);
}

#sidebar .nav-link i {
    margin-right: .5rem;
}

/* Дополнительные стили для админ-интерфейса */
.admin-header {
    background-color: var(--accent-color);
    padding: 1rem;
    margin-bottom: 1.5rem;
    border-radius: .25rem;
}

.admin-card {
    border: 1px solid var(--secondary-color);
    border-radius: .25rem;
    padding: 1rem;
    margin-bottom: 1rem;
}

.admin-stats {
    background-color: var(--accent-color);
    color: var(--text-dark);
    padding: 1rem;
    border-radius: .25rem;
    margin-bottom: 1rem;
}

.admin-table th {
    background-color: var(--accent-color);
}

.admin-table tr:hover {
    background-color: rgba(255, 165, 0, 0.1);
}

/* Стили для фильтров */
.filters-section {
    background-color: rgba(255, 215, 0, 0.1);
    padding: 1rem;
    border-radius: .25rem;
    margin-bottom: 1.5rem;
}

/* Стили для статистики */
.stat-card {
    background-color: white;
    border-left: 4px solid var(--primary-color);
    padding: 1rem;
    margin-bottom: 1rem;
    box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
}

.stat-card.warning {
    border-left-color: var(--secondary-color);
}

.stat-card.success {
    border-left-color: var(--accent-color);
}

/* Стили для графиков */
.chart-container {
    background-color: white;
    padding: 1rem;
    border-radius: .25rem;
    box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    margin-bottom: 1.5rem;
}
</style>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    // Initialize all tooltips
    $('[data-toggle="tooltip"]').tooltip();

    // Initialize all popovers
    $('[data-toggle="popover"]').popover();

    // Initialize all datepickers
    $('.datepicker').datepicker({
        format: 'yyyy-mm-dd',
        autoclose: true,
        todayHighlight: true
    });
});
</script>
{% endblock %}
